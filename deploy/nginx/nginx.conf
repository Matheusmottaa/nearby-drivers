worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    # Reescrito por refresh-upstreams.sh conforme o /readyz de cada réplica.
    include /etc/nginx/upstreams/*.conf;

    # Host do passageiro e do app do motorista.
    server {
        listen 8080;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /rides {
            proxy_pass http://ride;
            include /etc/nginx/proxy-params.conf;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /drivers {
            proxy_pass http://driver;
            include /etc/nginx/proxy-params.conf;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8081;

        # Pool interno. O matching chama http://nginx:8081.

        location /routes {
            proxy_pass http://routing;
            include /etc/nginx/proxy-params.conf;
            proxy_request_buffering on;
            proxy_next_upstream error timeout http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
        }

        location /nodes {
            proxy_pass http://routing;
            include /etc/nginx/proxy-params.conf;
            proxy_next_upstream error timeout http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
        }

        location / {
            return 404;
        }
    }
}
