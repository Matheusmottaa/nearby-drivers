apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Postgres (ride)
    uid: postgres-ride
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana
    secureJsonData:
      password: grafana
    jsonData:
      database: nearby
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
