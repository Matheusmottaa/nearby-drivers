# Dependências locais. Na máquina: localhost. Entre containers: o nome do serviço.
#
#   postgres  postgres://ride:ride@localhost:5432/nearby?sslmode=disable
#             postgres://driver:driver@localhost:5432/nearby?sslmode=disable
#   redis     redis://localhost:6379
#   kafka     localhost:9092
#   nginx     http://localhost:8080          /rides e /drivers
#             http://nginx:8081              /routes e /nodes, só na rede do compose
#
# Dentro da rede do compose o broker interno é kafka:19092.

name: nearby-drivers

x-routing: &routing
  image: nearby-drivers/routing-service:latest
  environment:
    HTTP_ADDR: ":8080"
    GRAPH_PATH: /data/maps/graph.txt
  volumes:
    - ./data/maps:/data/maps:ro
  healthcheck:
    test: ["CMD", "/routing-service", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nearby
      POSTGRES_PASSWORD: nearby
      POSTGRES_DB: nearby
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearby -d nearby"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    # Só TTL. Sem RDB e sem AOF.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    volumes:
      - ./deploy/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  ride-service:
    image: nearby-drivers/ride-service:latest
    build:
      context: .
      dockerfile: deploy/ride-service/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://ride:ride@postgres:5432/nearby?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ride-service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  driver-service:
    image: nearby-drivers/driver-service:latest
    build:
      context: .
      dockerfile: deploy/driver-service/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://driver:driver@postgres:5432/nearby?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # /readyz fica 503 até o índice espacial (etapa 4). -live só diz que o
    # processo escuta; o nginx tira o upstream enquanto /readyz não for 200.
    healthcheck:
      test: ["CMD", "/driver-service", "-live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  matching-service:
    image: nearby-drivers/matching-service:latest
    build:
      context: .
      dockerfile: deploy/matching-service/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
      DRIVER_URL: http://nginx:8080
      ROUTING_URL: http://nginx:8081
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/matching-service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  routing-1:
    <<: *routing
    build:
      context: .
      dockerfile: deploy/routing-service/Dockerfile

  routing-2:
    <<: *routing
    pull_policy: never

  nginx:
    image: nearby-drivers/nginx:latest
    build:
      context: ./deploy/nginx
    init: true
    ports:
      - "8080:8080"
    depends_on:
      ride-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      routing-1:
        condition: service_healthy
      routing-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
